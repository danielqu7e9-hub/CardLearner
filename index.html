<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardLearner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='1.8' stroke-linecap='round'><rect x='3.5' y='6.5' width='11' height='14' rx='2.5' stroke='%23c8a45d'/><path d='M9.5 3.5h8.5a2.5 2.5 0 0 1 2.5 2.5v9' stroke='%230f1b33'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark" id="brand-mark"></span><span class="brand-name">CardLearner</span></a>
    <div class="topbar-stats" id="topbar-stats"></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-settings" title="Ajustes" aria-label="Ajustes"></button>
    </div>
  </header>

  <main id="app"></main>

  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-inner"><span id="drop-icon"></span>Suelta el mazo (.json o .js)</div>
  </div>
  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>
  <input type="file" id="file-input" accept=".json,.js,application/json,text/javascript" hidden multiple>

  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/store.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/code-editor.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/sample-deck.js"></script>
  <script src="js/sample-deck-multi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
